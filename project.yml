name: MFA
options:
  bundleIdPrefix: com.mfa
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  MFA:
    type: application
    platform: macOS
    sources:
      - Sources/MFA
    resources:
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mfa.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MFA.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
    dependencies:
      - package: GRDB.swift
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/MFA.entitlements

  MFATests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MFATests
    dependencies:
      - target: MFA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mfa.app.tests

packages:
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
